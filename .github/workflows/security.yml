name: Security

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "27 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-audit:
    name: actionlint + zizmor (via devenv)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF findings to code scanning
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31.11.3
        with:
          extra_nix_config: |
            accept-flake-config = true

      - uses: cachix/cachix-action@v17
        with:
          name: devenv

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      - name: actionlint (static analysis)
        run: devenv shell -- actionlint -color

      - name: zizmor (vulnerability audit)
        run: |
          devenv shell -- zizmor --persona=pedantic \
            --format=sarif .github/workflows > zizmor.sarif

      - name: Upload zizmor SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4.39.1
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  # Fails when .github/workflows/actions.lock is out of sync with the
  # workflows or a locked pin no longer verifies upstream.
  lockfile:
    name: actions.lock
    runs-on: ubuntu-slim
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify
