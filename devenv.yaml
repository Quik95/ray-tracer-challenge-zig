inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  # zizmor only: devenv-nixpkgs lags, and lockfile support needs zizmor >= 1.32.
  nixpkgs-unstable:
    url: github:NixOS/nixpkgs/nixpkgs-unstable
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
